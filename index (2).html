<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDK – Outils et liens</title>
<meta name="description" content="Mes outils JDR, professionnels et perso, et mon tableau de bord de liens.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12161f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("cdk.theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="data.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>CDK</h1><p>Mes outils et mes sites du quotidien</p></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Rechercher (touche /)" aria-label="Rechercher un outil ou un site" autocomplete="off">
      <button class="btn" id="theme" type="button"></button>
      <button class="btn" id="edit" type="button" aria-pressed="false">Modifier</button>
    </div>
  </header>

  <div class="admin" id="admin" hidden>
    <span id="status"></span>
    <button class="btn sm primary" id="gh" type="button">Publier sur GitHub</button>
    <button class="btn sm" id="ghset" type="button">Réglages GitHub</button>
    <button class="btn sm" id="export" type="button">Exporter data.js</button>
    <button class="btn sm" id="import" type="button">Importer</button>
    <button class="btn sm" id="reset" type="button">Revenir à data.js</button>
    <input id="file" type="file" accept=".js,.json" hidden>
  </div>

  <div id="quick"></div>

  <section class="zone" aria-labelledby="t1">
    <div class="zh"><h2 id="t1">Mes outils</h2><button class="btn sm edit-only" type="button" data-a="newgrp" data-z="tools">+ Rubrique</button></div>
    <div id="tools"></div>
  </section>
  <section class="zone" aria-labelledby="t2">
    <div class="zh"><h2 id="t2">Mes sites</h2><button class="btn sm edit-only" type="button" data-a="newgrp" data-z="links">+ Rubrique</button></div>
    <div id="links"></div>
  </section>

  <p id="none" class="empty" hidden>Aucun résultat. Essaie un autre mot.</p>
  <footer>© 2026 – Essais Web CDK</footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h3 id="dt" style="border:0;padding:0;margin-bottom:12px"></h3>
    <label>Rubrique<select id="fg"></select></label>
    <label>Nom<input id="fn" required></label>
    <label>Description<input id="fd"></label>
    <label>Adresse du lien<input id="fu" required placeholder="dnd/initiative.html ou https://…"></label>
    <label>Image (facultatif)<input id="fi" placeholder="img/mon-image.jpg"></label>
    <label class="chk"><input type="checkbox" id="fs"> Pas encore créé (bientôt)</label>
    <div class="acts"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="gdlg">
  <form method="dialog" id="gf">
    <h3 style="border:0;padding:0;margin-bottom:12px">Publication GitHub</h3>
    <label>Dépôt (compte/nom)<input id="gr" placeholder="ceedrik/CDK" autocomplete="off"></label>
    <label>Fichier à mettre à jour<input id="gp" placeholder="data.js" autocomplete="off"></label>
    <label>Jeton d’accès (Contents : lecture et écriture, limité à ce dépôt)<input id="gt" type="password" autocomplete="off"></label>
    <div class="acts"><button class="btn" value="cancel" formnovalidate>Annuler</button><button class="btn primary" value="ok">Enregistrer</button></div>
  </form>
</dialog>

<script>
(function(){
var LS=window.localStorage, root=document.documentElement;
var COLORS=["#b7791f","#3b6fb6","#b5413a","#1f8a8a","#7a5fb0","#c26a1a","#2f8f5b","#a23e6b"], ZONES=["tools","links"];
function $(id){return document.getElementById(id)}
function get(k,d){try{var v=LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function put(k,v){try{LS.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function safe(u){u=String(u||"").trim();return /^(javascript|data|vbscript):/i.test(u)?"#":u}
function sane(d){
  if(!d||!Array.isArray(d.tools)||!Array.isArray(d.links))return null;
  var o={};
  ZONES.forEach(function(z){o[z]=d[z].map(function(g,k){return {
    t:String(g.t||"Sans titre"),c:/^#[0-9a-f]{3,8}$/i.test(g.c)?g.c:COLORS[k%COLORS.length],
    items:(Array.isArray(g.items)?g.items:[]).map(function(i){return {n:String(i.n||""),d:String(i.d||""),u:String(i.u||""),i:String(i.i||""),soon:!!i.soon}})}})});
  return o;
}
var P0=get("cdk.pub",null),L0=get("cdk.data",null);
if(L0&&P0&&P0.s===JSON.stringify(L0)&&Date.now()-P0.t>6e5)L0=null;
var data=sane(L0)||sane(window.CDK_DATA);
var fav=get("cdk.fav",[]), rec=get("cdk.rec",[]), closed=get("cdk.closed",[]), edit=false, q="";

function find(k){
  for(var a=0;a<2;a++)for(var g=0;g<data[ZONES[a]].length;g++){var G=data[ZONES[a]][g];
    for(var i=0;i<G.items.length;i++){var it=G.items[i];if(ZONES[a]+"|"+it.n+"|"+it.u===k)return {z:ZONES[a],c:G.c,it:it}}}
  return null;
}
function cell(z,c,gi,ii,it,quick){
  var k=z+"|"+it.n+"|"+it.u, ext=z==="links"?' target="_blank" rel="noopener noreferrer"':"";
  var img=it.i?'<img src="'+esc(safe(it.i))+'" alt="" loading="lazy" onerror="this.remove()">':"";
  var txt='<span class="txt"><span class="name">'+esc(it.n)+(it.soon?'<span class="badge">bientôt</span>':"")+'</span>'+(it.d?'<span class="desc">'+esc(it.d)+'</span>':"")+'</span>';
  var tile=(it.soon||edit)?'<div class="tile'+(it.soon?" soon":"")+'">'+img+txt+'</div>'
    :'<a class="tile" data-k="'+esc(k)+'" href="'+esc(safe(it.u))+'"'+ext+'>'+img+txt+'</a>';
  var d=' data-z="'+z+'" data-g="'+gi+'" data-i="'+ii+'"', f=fav.indexOf(k)>-1, ctl;
  if(quick||!edit) ctl='<button class="star" type="button" data-a="fav" data-k="'+esc(k)+'" aria-pressed="'+f+'" aria-label="Favori : '+esc(it.n)+'">'+(f?"★":"☆")+'</button>';
  else ctl='<span class="ctl"><button type="button" data-a="up"'+d+' aria-label="Monter">↑</button><button type="button" data-a="down"'+d+' aria-label="Descendre">↓</button><button type="button" data-a="edit"'+d+' aria-label="Modifier">✎</button><button type="button" data-a="del"'+d+' aria-label="Supprimer">✕</button></span>';
  return '<div class="cell" style="--c:'+c+'">'+tile+ctl+'</div>';
}
function group(z,g,gi){
  var key=z+"|"+g.t;
  var items=g.items.map(function(it,ii){return (!q||norm(g.t+" "+it.n+" "+it.d).indexOf(q)>-1)?cell(z,g.c,gi,ii,it,false):""}).join("");
  if(!items&&!(edit&&!q))return "";
  var d=' data-z="'+z+'" data-g="'+gi+'"';
  var ctl=edit?'<span class="ctl2"><button type="button" data-a="add"'+d+' aria-label="Ajouter">＋</button><button type="button" data-a="gren"'+d+' aria-label="Renommer">✎</button><button type="button" data-a="gup"'+d+' aria-label="Monter">↑</button><button type="button" data-a="gdown"'+d+' aria-label="Descendre">↓</button><button type="button" data-a="gdel"'+d+' aria-label="Supprimer">✕</button></span>':"";
  return '<details class="grp" data-k="'+esc(key)+'" style="--c:'+g.c+'"'+((q||closed.indexOf(key)<0)?" open":"")+'><summary><h3>'+esc(g.t)+'</h3>'+ctl+'</summary><div class="tiles'+(z==="links"?" small":"")+'">'+items+'</div></details>';
}
function row(title,keys){
  var cs=keys.map(function(k){var f=find(k);return f&&!f.it.soon?cell(f.z,f.c,0,0,f.it,true):""}).join("");
  return cs?'<section class="zone"><h2>'+title+'</h2><div class="tiles small">'+cs+'</div></section>':"";
}
function render(){
  document.body.classList.toggle("edit",edit);
  ZONES.forEach(function(z){$(z).innerHTML=data[z].map(function(g,gi){return group(z,g,gi)}).join("")});
  $("quick").innerHTML=(q||edit)?"":row("Favoris",fav)+row("Récents",rec.filter(function(k){return fav.indexOf(k)<0}).slice(0,6));
  $("none").hidden=!q||document.querySelectorAll("#tools .cell,#links .cell").length>0;
  var P=get("cdk.pub",null),L=get("cdk.data",null);
  $("status").textContent=!L?"Contenu identique à data.js.":(P&&P.s===JSON.stringify(data))?"Publié sur GitHub.":"Modifications non publiées : publie-les sur GitHub ou exporte data.js.";
}
function save(){put("cdk.data",data);render()}
function mv(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t}

/* Dialogue d'ajout / modification */
var dlg=$("dlg"), ctx=null;
function openDlg(z,g,i){
  ctx={z:z,g:g,i:i};var it=i>-1?data[z][g].items[i]:{n:"",d:"",u:"",i:"",soon:false};
  $("dt").textContent=i>-1?"Modifier":"Ajouter";
  $("fg").innerHTML=data[z].map(function(G,k){return '<option value="'+k+'"'+(k===g?" selected":"")+'>'+esc(G.t)+'</option>'}).join("");
  $("fn").value=it.n;$("fd").value=it.d;$("fu").value=it.u;$("fi").value=it.i;$("fs").checked=it.soon;
  dlg.returnValue="";dlg.showModal();
}
dlg.addEventListener("close",function(){
  if(dlg.returnValue!=="ok"||!ctx)return;
  var it={n:$("fn").value.trim(),d:$("fd").value.trim(),u:$("fu").value.trim(),i:$("fi").value.trim(),soon:$("fs").checked}, ng=+$("fg").value, c=ctx, L=data[c.z];
  if(c.i<0)L[ng].items.push(it);
  else if(ng===c.g)L[c.g].items[c.i]=it;
  else{L[c.g].items.splice(c.i,1);L[ng].items.push(it)}
  save();
});

/* Actions */
function act(b){
  var a=b.dataset.a,z=b.dataset.z,g=+b.dataset.g,i=+b.dataset.i,L=data[z],G=L&&L[g];
  if(a==="fav"){var k=b.dataset.k,p=fav.indexOf(k);if(p>-1)fav.splice(p,1);else fav.push(k);put("cdk.fav",fav);render()}
  else if(a==="up"||a==="down"){mv(G.items,i,a==="up"?-1:1);save()}
  else if(a==="gup"||a==="gdown"){mv(L,g,a==="gup"?-1:1);save()}
  else if(a==="edit")openDlg(z,g,i);
  else if(a==="add")openDlg(z,g,-1);
  else if(a==="del"){if(confirm("Supprimer « "+G.items[i].n+" » ?")){G.items.splice(i,1);save()}}
  else if(a==="gdel"){if(confirm("Supprimer la rubrique « "+G.t+" » et ses "+G.items.length+" entrée(s) ?")){L.splice(g,1);save()}}
  else if(a==="gren"){var t=prompt("Nom de la rubrique",G.t);if(t&&t.trim()){G.t=t.trim();save()}}
  else if(a==="newgrp"){var n=prompt("Nom de la nouvelle rubrique");if(n&&n.trim()){L.push({t:n.trim(),c:COLORS[L.length%COLORS.length],items:[]});save()}}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");
  if(b){e.preventDefault();act(b);return}
  var a=e.target.closest("a.tile[data-k]");
  if(a){var k=a.dataset.k;rec=[k].concat(rec.filter(function(x){return x!==k})).slice(0,10);put("cdk.rec",rec)}
});
document.addEventListener("toggle",function(e){
  var d=e.target;if(q||!d.matches||!d.matches("details.grp"))return;
  var k=d.dataset.k,p=closed.indexOf(k);
  if(d.open&&p>-1)closed.splice(p,1);else if(!d.open&&p<0)closed.push(k);
  put("cdk.closed",closed);
},true);

/* Recherche et raccourcis */
$("q").addEventListener("input",function(){q=norm(this.value.trim());render()});
$("q").addEventListener("keydown",function(e){
  if(e.key==="Enter"){var a=document.querySelector("#tools a.tile,#links a.tile");if(a)a.click()}
  else if(e.key==="Escape"){this.value="";q="";render();this.blur()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&!dlg.open){e.preventDefault();$("q").focus()}
});

/* Thème */
var TH=["auto","light","dark"],LAB={auto:"Thème : auto",light:"Thème : clair",dark:"Thème : sombre"},cur="auto";
try{cur=LS.getItem("cdk.theme")||"auto"}catch(e){}
function theme(t){cur=t;if(t==="auto")delete root.dataset.theme;else root.dataset.theme=t;$("theme").textContent=LAB[t]}
$("theme").addEventListener("click",function(){var n=TH[(TH.indexOf(cur)+1)%3];theme(n);try{LS.setItem("cdk.theme",n)}catch(e){}});
theme(cur);

/* Édition, export, import */
$("edit").addEventListener("click",function(){edit=!edit;this.textContent=edit?"Terminer":"Modifier";this.setAttribute("aria-pressed",edit);$("admin").hidden=!edit;render()});
$("export").addEventListener("click",function(){
  var u=URL.createObjectURL(new Blob(["window.CDK_DATA = "+JSON.stringify(data,null,1)+";\n"],{type:"text/javascript"})),a=document.createElement("a");
  a.href=u;a.download="data.js";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);
});
$("import").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(){
  var f=this.files[0],inp=this;if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=sane(JSON.parse(String(r.result).replace(/^[^{]*/,"").replace(/;?\s*$/,"")));if(!d)throw 0;
    if(confirm("Remplacer les données actuelles par ce fichier ?")){data=d;save()}
  }catch(x){alert("Fichier non valide.")}inp.value=""};
  r.readAsText(f);
});
$("reset").addEventListener("click",function(){
  if(confirm("Abandonner les modifications de cet appareil et revenir au contenu de data.js ?")){try{LS.removeItem("cdk.data")}catch(e){}data=sane(window.CDK_DATA);render()}
});

/* Publication sur GitHub */
var gh=get("cdk.gh",{repo:"ceedrik/CDK",path:"data.js",token:""});
function out(){return "window.CDK_DATA = "+JSON.stringify(data,null,1)+";\n"}
function b64(s){var b=new TextEncoder().encode(s),r="";for(var i=0;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)}
function ghu(){return "https://api.github.com/repos/"+gh.repo+"/contents/"+gh.path.split("/").map(encodeURIComponent).join("/")}
function ghh(){return {Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"}}
var gd=$("gdlg");
function gdOpen(){$("gr").value=gh.repo;$("gp").value=gh.path;$("gt").value=gh.token;gd.returnValue="";gd.showModal()}
gd.addEventListener("close",function(){if(gd.returnValue!=="ok")return;gh={repo:$("gr").value.trim(),path:$("gp").value.trim()||"data.js",token:$("gt").value.trim()};put("cdk.gh",gh)});
$("ghset").addEventListener("click",gdOpen);
$("gh").addEventListener("click",function(){
  if(!gh.repo||!gh.token){gdOpen();return}
  var btn=this,s=JSON.stringify(data),body=out();btn.disabled=true;btn.textContent="Publication…";
  fetch(ghu(),{headers:ghh()}).then(function(g){
    if(g.ok)return g.json().then(function(j){return j.sha});
    if(g.status===404)return undefined;
    throw new Error("lecture "+g.status);
  }).then(function(sha){
    return fetch(ghu(),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghh()),body:JSON.stringify({message:"Mise à jour de data.js",content:b64(body),sha:sha})});
  }).then(function(r){
    if(!r.ok)throw new Error("envoi "+r.status);
    put("cdk.pub",{t:Date.now(),s:s});render();
    alert("Publié. Visible sur tes autres appareils dans environ une minute.");
  }).catch(function(e){alert("Échec de la publication ("+e.message+")")}).then(function(){btn.disabled=false;btn.textContent="Publier sur GitHub"});
});

render();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
